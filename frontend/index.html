<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nanobot Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-root: #0C0D12;
        --bg-surface: #111318;
        --bg-card: #16181F;
        --bg-elevated: #1C1E26;
        --bg-hover: #22252E;
        --bg-input: #0E0F14;
        --border-subtle: #1E2028;
        --border-default: #282A34;
        --border-strong: #3A3D48;
        --text-primary: #EDEEF1;
        --text-secondary: #9BA3B5;
        --text-muted: #6B7585;
        --green: #4ADE80;
        --green-dim: #2DD468;
        --green-soft: rgba(74, 222, 128, 0.10);
        --green-glow: rgba(74, 222, 128, 0.05);
        --orange: #F59E0B;
        --orange-soft: rgba(245, 158, 11, 0.10);
        --blue: #60A5FA;
        --blue-soft: rgba(96, 165, 250, 0.10);
        --red: #F87171;
        --red-soft: rgba(248, 113, 113, 0.10);
        --purple: #A78BFA;
        --purple-soft: rgba(167, 139, 250, 0.10);
        --r-sm: 8px;
        --r-md: 12px;
        --r-lg: 16px;
        --r-xl: 20px;
        --shadow-card: 0 1px 2px rgba(0,0,0,0.16), 0 2px 8px rgba(0,0,0,0.12);
        --shadow-elevated: 0 4px 16px rgba(0,0,0,0.28);
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
        /* Semantic tokens */
        --overlay-bg: rgba(0,0,0,0.55);
        --msg-user-bg: linear-gradient(135deg, #1A365D, #1E3A5F);
        --msg-user-text: #DBEAFE;
        --msg-user-border: rgba(96, 165, 250, 0.12);
        --msg-user-link: #93C5FD;
        --msg-user-code-bg: rgba(255,255,255,0.12);
        --msg-user-pre-bg: rgba(0,0,0,0.25);
        --msg-user-pre-border: rgba(255,255,255,0.08);
        --accent-on-green: #0a0f0d;
        --accent-on-green-strong: #000;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-root: #F4F5F7;
          --bg-surface: #FFFFFF;
          --bg-card: #FFFFFF;
          --bg-elevated: #F0F1F5;
          --bg-hover: #E8EAF0;
          --bg-input: #F8F9FB;
          --border-subtle: #E5E7EB;
          --border-default: #D1D5DB;
          --border-strong: #9CA3AF;
          --text-primary: #111827;
          --text-secondary: #4B5563;
          --text-muted: #9CA3AF;
          --green: #16A34A;
          --green-dim: #15803D;
          --green-soft: rgba(22, 163, 74, 0.08);
          --green-glow: rgba(22, 163, 74, 0.04);
          --orange: #D97706;
          --orange-soft: rgba(217, 119, 6, 0.08);
          --blue: #2563EB;
          --blue-soft: rgba(37, 99, 235, 0.08);
          --red: #DC2626;
          --red-soft: rgba(220, 38, 38, 0.08);
          --purple: #7C3AED;
          --purple-soft: rgba(124, 58, 237, 0.08);
          --shadow-card: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
          --shadow-elevated: 0 4px 16px rgba(0,0,0,0.08);
          --overlay-bg: rgba(0,0,0,0.3);
          --msg-user-bg: linear-gradient(135deg, #DBEAFE, #BFDBFE);
          --msg-user-text: #1E3A5F;
          --msg-user-border: rgba(37, 99, 235, 0.15);
          --msg-user-link: #2563EB;
          --msg-user-code-bg: rgba(37, 99, 235, 0.08);
          --msg-user-pre-bg: rgba(37, 99, 235, 0.06);
          --msg-user-pre-border: rgba(37, 99, 235, 0.12);
          --accent-on-green: #fff;
          --accent-on-green-strong: #fff;
        }
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: var(--font-sans);
        background: var(--bg-root);
        color: var(--text-secondary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }
    </style>
    <script type="module" src="/src/app.ts"></script>
  </head>
  <body>
    <nano-app></nano-app>
  </body>
</html>
